name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-openssl
      - shell: msys2 {0}
        run: |
          # uORM 代理（如需）：git config --global http.proxy ...
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DZENITH_TLS=openssl -DZENITH_ENABLE_ORM=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure

  # 性能门禁：只校验与硬件无关的不变量（大文件峰值 RSS、吞吐下限），
  # 抓「零拷贝退化成整块缓冲」这类回归——上一轮就是靠人肉对比才发现的。
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ libssl-dev
      - name: Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
                -DZENITH_TLS=openssl -DZENITH_ENABLE_ORM=OFF \
                -DZENITH_BUILD_TESTS=OFF -DZENITH_BUILD_EXAMPLES=OFF \
                -DZENITH_BUILD_PLUGINS=OFF
          cmake --build build --target zenith_bench_server zenith_bench
      - name: 性能/内存门禁
        run: |
          python3 tools/bench_gate.py \
            --server build/bin/zenith_bench_server \
            --bench  build/bin/zenith_bench \
            --out    bench-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: bench-report.json
          if-no-files-found: warn

  # Release 模式跑全量测试：Debug 全绿不代表 Release 全绿（NDEBUG/优化会暴露不同问题）
  linux-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ libssl-dev sqlite3 libsqlite3-dev
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
                -DZENITH_TLS=openssl \
                -DUORM_ENABLE_MYSQL=OFF -DUORM_ENABLE_POSTGRESQL=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure

  # 覆盖率：Clang profile-instr → llvm-cov 汇总，结果写 step summary 并上传
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang llvm libssl-dev
      - name: 构建（带插桩）
        run: |
          cmake -B build-cov -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
                -DZENITH_COVERAGE=ON -DZENITH_TLS=openssl -DZENITH_ENABLE_ORM=OFF \
                -DZENITH_BUILD_EXAMPLES=OFF
          cmake --build build-cov
      - name: 跑测试并汇总
        run: |
          set -euo pipefail
          mkdir -p prof
          LLVM_PROFILE_FILE="$PWD/prof/%p.profraw" \
            ctest --test-dir build-cov --output-on-failure
          llvm-profdata merge -sparse prof/*.profraw -o cov.profdata
          BINS=$(find build-cov/bin -maxdepth 1 -type f -name 'test_*' | tr '\n' ' ')
          llvm-cov report $BINS -instr-profile=cov.profdata \
            --ignore-filename-regex='(thirdparty|tests|plugins|examples)/' | tee cov.txt
          llvm-cov export $BINS -instr-profile=cov.profdata -summary-only > cov.json
          # HTML 明细（带每行命中次数），随 artifact 发布，便于定位未覆盖分支
          llvm-cov show $BINS -instr-profile=cov.profdata \
            --ignore-filename-regex='(thirdparty|tests|plugins|examples)/' \
            --format=html --output-dir=cov-html > /dev/null
          echo '### 覆盖率（行）' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 3 cov.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: 覆盖率门限
        env:
          # 阈值放仓库变量里，随覆盖率提升上调，不用改 workflow。
          # 当前实测 85.8%（排除 thirdparty/tests/plugins/examples），留 ~6 个点余量。
          MIN_PCT: ${{ vars.COVERAGE_MIN || '80' }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          d = json.load(open('cov.json'))
          pct = d['data'][0]['totals']['lines']['percent']
          floor = float(os.environ.get('MIN_PCT', '20'))
          print(f"行覆盖率 {pct:.2f}%（门限 {floor:.0f}%）")
          sys.exit(0 if pct >= floor else 1)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            cov.txt
            cov-html/
          if-no-files-found: warn

  # fuzz 冒烟：每个目标 45s（夜间 workflow 跑长时段）
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libssl-dev
      - name: 构建 fuzzer
        run: |
          cmake -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
                -DZENITH_SANITIZE=address,undefined \
                -DZENITH_BUILD_FUZZERS=ON -DZENITH_BUILD_TESTS=OFF \
                -DZENITH_BUILD_EXAMPLES=OFF -DZENITH_BUILD_PLUGINS=OFF \
                -DZENITH_TLS=openssl -DZENITH_ENABLE_ORM=OFF
          cmake --build build-fuzz -j 4
      - name: 冒烟 fuzz（45s/目标）
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          set -euo pipefail
          for t in fuzz_http_request fuzz_http_response fuzz_ws_frame fuzz_json fuzz_audio_wav; do
            mkdir -p "fuzz/corpus/$t"
            echo "== $t"
            "./build-fuzz/fuzz/$t" -max_total_time=45 -rss_limit_mb=2048 \
              "fuzz/corpus/$t" || { echo "::error::$t 崩溃"; exit 1; }
          done

  # 下游消费冒烟：装 SDK → 用 find_package(Zenith CONFIG) 编一个独立小项目。
  # 这条链路此前是坏的（导出目标引用了 ZLIB::ZLIB 但 config 没 find_dependency，
  # 链接项还带构建机绝对路径），不站在消费者视角根本发现不了。
  consumer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ libssl-dev zlib1g-dev
      - name: 构建并安装 SDK
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
                -DZENITH_TLS=openssl -DZENITH_ENABLE_ORM=OFF \
                -DZENITH_BUILD_TESTS=OFF -DZENITH_BUILD_EXAMPLES=OFF \
                -DZENITH_BUILD_PLUGINS=OFF
          cmake --build build
          cmake --install build --prefix "$PWD/sdk"
      - name: 编译并运行下游项目
        run: |
          set -euo pipefail
          cd tools/consumer_smoke
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/sdk"
          cmake --build build
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/sdk/lib" ./build/consumer_static
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/sdk/lib" ./build/consumer_shared

  # 格式门禁：全仓 clang-format 检查。版本钉死（pip 包）保证本地/CI 结果一致——
  # 用发行版自带的 clang-format 会因版本差异产生不同结果，门禁会变成噪音。
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 安装 clang-format（钉版本）
        run: python3 -m pip install --quiet clang-format==23.1.5
      - name: clang-format 检查
        run: |
          set -euo pipefail
          CF="$(python3 -c 'import clang_format, os; print(os.path.join(os.path.dirname(clang_format.__file__), "data", "bin", "clang-format"))')"
          "$CF" --version
          FILES=$(git ls-files '*.cpp' '*.hpp' '*.h' '*.c' | grep -v '^thirdparty/' || true)
          [ -z "$FILES" ] && exit 0
          "$CF" --dry-run --Werror $FILES

  # 容器镜像：构建 + 起服务 + 打接口，验证 Dockerfile 不是摆设
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: 构建镜像
        run: docker build -t zenith:ci .
      - name: 起容器并打接口
        run: |
          set -euo pipefail
          docker run -d --name zenith-ci -p 18080:8080 zenith:ci
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/hello -o /tmp/hello.txt 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::容器 40s 内没有响应 /hello"
            docker logs --tail 50 zenith-ci || true
            exit 1
          fi
          cat /tmp/hello.txt
          grep -q "Hello, Zenith!" /tmp/hello.txt
          docker rm -f zenith-ci

  # MSVC：验证「Windows 也能用 MSVC 编过」。目前不带 TLS（无 OpenSSL 依赖），
  # 也不跑测试——完整支持（含 TLS + 测试）留给后续。
  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure + Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
                -DZENITH_TLS=none -DZENITH_ENABLE_ORM=OFF `
                -DZENITH_BUILD_TESTS=OFF -DZENITH_BUILD_EXAMPLES=OFF `
                -DZENITH_BUILD_PLUGINS=OFF
          cmake --build build -j 4

  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ libssl-dev sqlite3 libsqlite3-dev
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
                -DZENITH_TLS=openssl \
                -DUORM_ENABLE_MYSQL=OFF -DUORM_ENABLE_POSTGRESQL=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure
      # 文档内链：重构 README / 拆分 docs 时容易留死链
      - name: 文档内链检查
        run: python3 tools/check_docs_links.py

  # 内存安全防线：ASan+UBSan 全量、TSan 跑并发套件（两者互斥，分两个构建目录）。
  # 这两类问题此前靠人肉 review 才发现（缓冲越界搬数据、shared_ptr 环），
  # 上 sanitizer 让机器替我们盯。
  linux-sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libssl-dev
      - name: ASan + UBSan（全量，内存错误阻塞）
        env:
          # 泄漏检测单独一步跑（见下）：LSan 在测试进程退出时报告的是
          # 「服务端对象仍存活」型问题，与内存安全错误分开跟踪。
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
                -DZENITH_SANITIZE=address,undefined \
                -DZENITH_TLS=openssl -DZENITH_ENABLE_ORM=OFF
          cmake --build build-asan
          ctest --test-dir build-asan --output-on-failure
      # 泄漏单独一步、非阻塞：目前有 4 个套件在进程退出时仍有连接/会话对象
      # 存活（见 README「sanitizer 现状」）。修好一个就从这里划掉一个，
      # 全部清零后把它并回上面的阻塞步骤。
      - name: LeakSanitizer（仅报告 · 已知 4 套件）
        continue-on-error: true
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=0
        run: |
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build-asan --output-on-failure \
                -R "test_websocket|test_m5_web|test_m13e|test_m13g"
      # TSan：已清零并转阻塞（并发相关 5 套）。后续可扩到更多并发套件。
      - name: TSan（并发套件）
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          cmake -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
                -DZENITH_SANITIZE=thread \
                -DZENITH_TLS=openssl -DZENITH_ENABLE_ORM=OFF
          cmake --build build-tsan
          ctest --test-dir build-tsan --output-on-failure \
                -R "test_concurrency|test_m6|test_stream|test_websocket|test_m5_web|test_m13b|test_m13d|test_m13e|test_m13g|test_m11"

  linux-clang-coro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libssl-dev
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
                -DZENITH_TLS=openssl -DZENITH_ENABLE_COROUTINES=ON \
                -DZENITH_ENABLE_ORM=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure

  macos-clang:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: brew install ninja openssl@3
      # macOS 上全量构建（必须通过——这是「macOS 受支持」的硬承诺）
      - name: Build (macOS)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
                -DZENITH_TLS=openssl \
                -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) \
                -DZENITH_ENABLE_ORM=OFF
          cmake --build build
      # 核心套件阻塞：HTTP/网络/插件/流式/安全等必须全绿
      - name: Test (macOS 核心套件)
        run: |
          ctest --test-dir build --output-on-failure \
                -E "test_m13b|test_m13d"
      # AI 编排套件非阻塞：macOS 上有两个已知运行期问题（见 README「平台支持」）。
      # 仍在这里跑一遍，失败在日志里可见，但不阻塞合并——修好即可并回上面的阻塞步骤。
      - name: Test (macOS AI 编排套件 · 已知问题跟踪中)
        continue-on-error: true
        run: |
          ctest --test-dir build --output-on-failure \
                -R "test_m13b|test_m13d"
